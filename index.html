<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVCI Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: system-ui, -apple-system, sans-serif;
    /* Ekran görüntüsündeki koyu, hafif morumsu/siyah arka plan */
    background: linear-gradient(135deg, #120b18 0%, #0a050d 100%);
    color: #fff; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
  }

  /* En üstteki dev turuncu yazı */
  .ust-yazi {
    font-size: 32px; /* Mobilde tam sığması için */
    font-weight: 500;
    color: #ff6b35;
    margin-bottom: 80px; /* Logoyla arasındaki o büyük boşluk */
    text-align: center;
    letter-spacing: -0.5px;
    text-shadow: 0 0 20px rgba(255, 107, 53, 0.3); /* Hafif parlama */
  }

  /* AVCI Logosu */
  .logo-container {
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 5px;
  }
  .logo-icon {
    font-size: 42px;
    margin-right: 12px;
    filter: drop-shadow(0 0 15px rgba(255, 107, 53, 0.8)); /* Hedefin etrafındaki parlama */
  }
  .logo-text {
    font-size: 52px; font-weight: 900;
    background: linear-gradient(90deg, #ff6b35, #f7931e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -2px;
  }
  
  .slogan {
    color: #888; font-size: 13px; margin-bottom: 40px;
    letter-spacing: 1.5px;
  }

  /* Arama Kutusu */
  .arama-kutu {
    display: flex; gap: 8px; width: 100%; max-width: 600px;
    background: rgba(255,255,255,0.03);
    padding: 5px; border-radius: 30px;
    border: 1px solid rgba(255,107,53,0.4);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    transition: all 0.3s ease;
  }
  .arama-kutu:focus-within {
    border-color: #ff6b35;
    box-shadow: 0 0 25px rgba(255,107,53,0.3); /* Tıklayınca parlasın */
  }
  .arama-kutu input {
    flex: 1; padding: 14px 20px; border-radius: 25px;
    border: none; background: transparent;
    color: #fff; font-size: 15px; outline: none;
  }
  .arama-kutu input::placeholder { color: #666; }
  
  .arama-kutu button {
    padding: 12px 28px; border-radius: 25px; border: none;
    background: linear-gradient(90deg, #ff6b35, #f7931e);
    color: #fff; font-weight: bold; cursor: pointer; font-size: 15px;
    transition: transform 0.1s;
  }
  .arama-kutu button:active { transform: scale(0.95); }

  /* Kısayollar */
  .kisayollar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 16px; margin-top: 50px; max-width: 400px; width: 100%;
  }
  .kisayol {
    display: flex; flex-direction: column; align-items: center;
    text-decoration: none; color: #aaa; font-size: 12px;
    gap: 10px; transition: transform 0.2s;
  }
  .kisayol:hover { transform: translateY(-3px); color: #fff; }
  .kisayol-ikon {
    width: 60px; height: 60px; border-radius: 18px;
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; border: 1px solid rgba(255,255,255,0.08);
    transition: all 0.2s;
  }
  .kisayol:hover .kisayol-ikon { 
    background: rgba(255,107,53,0.15); 
    border-color: rgba(255,107,53,0.5); 
  }
</style>
</head>
<body>

  <!-- İşte o efsane yazı -->
  <div class="ust-yazi">adres yaz avlayak gardaş</div>

  <div class="logo-container">
    <div class="logo-icon">🎯</div>
    <div class="logo-text">AVCI</div>
  </div>
  <div class="slogan">AĞDA AVCILIK BAŞLASIN</div>

  <form class="arama-kutu" onsubmit="git(event)">
    <input id="q" placeholder="Bing'de ara veya adres yaz..." autocomplete="off" autofocus />
    <button type="submit">Ara</button>
  </form>

  <div class="kisayollar">
    <a class="kisayol" href="tarayici.html">
      <div class="kisayol-ikon">🌐</div>
      <span>Tarayıcı</span>
    </a>
    <a class="kisayol" href="https://youtube.com" target="_blank">
      <div class="kisayol-ikon">▶️</div>
      <span>YouTube</span>
    </a>
    <a class="kisayol" href="https://github.com" target="_blank">
      <div class="kisayol-ikon">🐙</div>
      <span>GitHub</span>
    </a>
    <a class="kisayol" href="https://bing.com" target="_blank">
      <div class="kisayol-ikon">🔍</div>
      <span>Bing</span>
    </a>
  </div>

<script>
function git(e) {
  e.preventDefault();
  let v = document.getElementById('q').value.trim();
  if (!v) return;
  
  if (!v.includes('.') && !v.startsWith('http')) {
    v = 'https://www.bing.com/search?q=' + encodeURIComponent(v);
  } else if (!v.startsWith('http')) {
    v = 'https://' + v;
  }
  
  window.location.href = 'tarayici.html?url=' + encodeURIComponent(v);
}
</script>
</body>
</html>
