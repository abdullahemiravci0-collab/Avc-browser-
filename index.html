<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVCI Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0a0a0f 0%, #1a1025 100%);
    color: #fff; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
  }

  /* AVCI Logosu */
  .logo-container {
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px;
  }
  .logo-icon {
    font-size: 50px;
    filter: drop-shadow(0 0 15px rgba(255, 107, 53, 0.5));
  }
  .logo-text {
    font-size: 54px; font-weight: 900;
    background: linear-gradient(90deg, #ff6b35, #f7931e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -2px;
    margin-left: 10px;
  }
  
  .slogan {
    color: #888; font-size: 14px; margin-bottom: 40px;
    letter-spacing: 1px;
  }

  /* Arama Kutusu */
  .arama-kutu {
    display: flex; gap: 8px; width: 100%; max-width: 600px;
    background: rgba(255,255,255,0.05);
    padding: 6px; border-radius: 30px;
    border: 1px solid rgba(255,107,53,0.3);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
  }
  .arama-kutu:focus-within {
    border-color: #ff6b35;
    box-shadow: 0 4px 25px rgba(255,107,53,0.2);
  }
  .arama-kutu input {
    flex: 1; padding: 14px 20px; border-radius: 25px;
    border: none; background: transparent;
    color: #fff; font-size: 16px; outline: none;
  }
  .arama-kutu input::placeholder { color: #666; }
  .arama-kutu button {
    padding: 14px 24px; border-radius: 25px; border: none;
    background: linear-gradient(90deg, #ff6b35, #f7931e);
    color: #fff; font-weight: bold; cursor: pointer; font-size: 15px;
    transition: transform 0.1s;
  }
  .arama-kutu button:active { transform: scale(0.95); }

  /* Kısayollar */
  .kisayollar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 16px; margin-top: 50px; max-width: 400px; width: 100%;
  }
  .kisayol {
    display: flex; flex-direction: column; align-items: center;
    text-decoration: none; color: #ccc; font-size: 12px;
    gap: 8px; transition: transform 0.2s;
  }
  .kisayol:hover { transform: translateY(-3px); color: #fff; }
  .kisayol-ikon {
    width: 56px; height: 56px; border-radius: 16px;
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; border: 1px solid rgba(255,255,255,0.1);
  }
  .kisayol:hover .kisayol-ikon { background: rgba(255,107,53,0.2); border-color: #ff6b35; }

  /* Alt Bilgi */
  .surum {
    position: absolute; bottom: 20px;
    color: #444; font-size: 11px; letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="logo-container">
    <div class="logo-icon">🎯</div>
    <div class="logo-text">AVCI</div>
  </div>
  <div class="slogan">AĞDA AVCILIK BAŞLASIN</div>

  <form class="arama-kutu" onsubmit="git(event)">
    <input id="q" placeholder="Bing'de ara veya adres yaz..." autocomplete="off" autofocus />
    <button type="submit">Ara</button>
  </form>

  <div class="kisayollar">
    <a class="kisayol" href="tarayici.html">
      <div class="kisayol-ikon">🌐</div>
      <span>Tarayıcı</span>
    </a>
    <a class="kisayol" href="https://youtube.com" target="_blank">
      <div class="kisayol-ikon">▶️</div>
      <span>YouTube</span>
    </a>
    <a class="kisayol" href="https://github.com" target="_blank">
      <div class="kisayol-ikon">🐙</div>
      <span>GitHub</span>
    </a>
    <a class="kisayol" href="https://bing.com" target="_blank">
      <div class="kisayol-ikon">🔍</div>
      <span>Bing</span>
    </a>
  </div>

  <div class="surum">AVCI BROWSER v0.2</div>

<script>
function git(e) {
  e.preventDefault();
  let v = document.getElementById('q').value.trim();
  if (!v) return;
  
  // Eğer nokta yoksa Bing'de ara
  if (!v.includes('.') && !v.startsWith('http')) {
    v = 'https://www.bing.com/search?q=' + encodeURIComponent(v);
  } else if (!v.startsWith('http')) {
    v = 'https://' + v;
  }
  
  // Tarayıcı sayfasına yönlendir
  window.location.href = 'tarayici.html?url=' + encodeURIComponent(v);
}
</script>
</body>
</html>
